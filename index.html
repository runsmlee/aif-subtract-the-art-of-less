    <!-- FAQ Structured Data for long-tail discoverability -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do you measure the cognitive load of a webpage?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cognitive load is measured by analyzing visual density, element count, text complexity, color variety, and interactive element density on a page. The Cognitive Load Analyzer scores each factor and produces a combined score from 0 (minimal load) to 100 (overwhelming). Lower scores indicate pages that are easier for users to process and act on."
          }
        },
        {
          "@type": "Question",
          "name": "What makes a website cognitively heavy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A website becomes cognitively heavy when it has too many visual elements competing for attention, excessive text blocks, inconsistent styling, too many calls-to-action, complex navigation, auto-playing media, and poor visual hierarchy. These force users to work harder to find what they need, increasing decision fatigue and reducing conversion rates."
          }
        },
        {
          "@type": "Question",
          "name": "How can I reduce cognitive load in web design?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Reduce cognitive load by removing unnecessary elements, limiting choices to the essential few, using consistent visual patterns, creating clear hierarchy with size and color, grouping related items together, minimizing text to what users actually read, and making the primary action obvious. The principle of subtraction — removing what doesn't serve the user — is the most effective approach."
          }
        },
        {
          "@type": "Question",
          "name": "What is a good cognitive load score for a webpage?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A cognitive load score below 40 is considered excellent — the page is clean, focused, and easy to navigate. Scores between 40 and 60 are average and may benefit from targeted simplification. Scores above 60 indicate the page is likely overwhelming users and should be prioritized for subtraction of unnecessary elements."
          }
        },
        {
          "@type": "Question",
          "name": "Why does cognitive load matter for conversion rates?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Research shows that every additional element on a page increases decision time and cognitive effort. High cognitive load leads to choice paralysis, higher bounce rates, and lower conversions. By measuring and reducing cognitive load, you create pages where users can quickly understand the value proposition and take action without friction."
          }
        }
      ]
    }
    </script>

    <script>
      // Prevent dark mode flash by setting class before React hydrates
      (function() {
        try {
          var theme = localStorage.getItem('subtract-theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
