<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Subtract — The Art of Less. Discover the power of removing what doesn't matter. Practice subtraction through interactive exercises, daily challenges, and guided reflection." />
    <meta name="theme-color" content="#EF4444" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph -->
    <meta property="og:title" content="Subtract — The Art of Less" />
    <meta property="og:description" content="Discover the power of removing what doesn't matter. Practice subtraction through interactive exercises, daily challenges, and guided reflection." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Subtract — The Art of Less" />
    <meta name="twitter:description" content="The most powerful improvements come not from adding more, but from removing what stands in the way." />

    <title>Subtract — The Art of Less</title>
    <script>
      // Prevent dark mode flash by setting class before React hydrates
      (function() {
        try {
          var theme = localStorage.getItem('subtract-theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
