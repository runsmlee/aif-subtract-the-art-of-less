<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="60" y1="0" x2="60" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="120" y1="0" x2="120" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="180" y1="0" x2="180" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="360" y1="0" x2="360" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="420" y1="0" x2="420" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="540" y1="0" x2="540" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="660" y1="0" x2="660" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="720" y1="0" x2="720" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="780" y1="0" x2="780" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="840" y1="0" x2="840" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="960" y1="0" x2="960" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="1020" y1="0" x2="1020" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="1080" y1="0" x2="1080" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="1140" y1="0" x2="1140" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="1200" y1="0" x2="1200" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="480" x2="1200" y2="480" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Decorative circles being subtracted (fading outward) -->
  <circle cx="180" cy="160" r="24" fill="none" stroke="#EF4444" stroke-width="1.5" opacity="0.12"/>
  <circle cx="280" cy="120" r="16" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.08"/>
  <circle cx="140" cy="260" r="12" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.06"/>
  <circle cx="1020" cy="140" r="20" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.1"/>
  <circle cx="1060" cy="480" r="18" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.08"/>
  <circle cx="160" cy="500" r="14" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.06"/>

  <!-- Central score circle with glow -->
  <circle cx="600" cy="230" r="88" fill="none" stroke="#EF4444" stroke-width="3" filter="url(#glow)" opacity="0.9"/>
  <circle cx="600" cy="230" r="72" fill="none" stroke="#EF4444" stroke-width="0.5" opacity="0.3"/>
  <circle cx="600" cy="230" r="100" fill="none" stroke="#EF4444" stroke-width="0.3" stroke-dasharray="4 8" opacity="0.2"/>

  <!-- Score arc (72/100 visualized as ~260 degrees) -->
  <circle cx="600" cy="230" r="88" fill="none" stroke="url(#accent)" stroke-width="4"
          stroke-dasharray="396 553" stroke-dashoffset="138" stroke-linecap="round" opacity="0.8"/>

  <!-- Score number -->
  <text x="600" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#EF4444" text-anchor="middle">72</text>
  <text x="600" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#94A3B8" text-anchor="middle">/100</text>

  <!-- Title -->
  <text x="600" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="-0.5">Cognitive Load Analyzer</text>

  <!-- Subtitle -->
  <text x="600" y="416" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="middle">Paste a URL. See its cognitive load. Know what to subtract.</text>

  <!-- Mock URL input bar -->
  <rect x="340" y="450" width="520" height="52" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="364" y="482" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#64748B">https://example.com</text>
  <!-- Submit button mockup -->
  <rect x="804" y="458" width="44" height="36" rx="8" fill="#EF4444"/>
  <line x1="818" y1="476" x2="834" y2="476" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Recommendation pills -->
  <rect x="335" y="524" width="148" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="409" y="545" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#F87171" text-anchor="middle">Remove 3 CTAs</text>

  <rect x="495" y="524" width="162" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="576" y="545" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#F87171" text-anchor="middle">Simplify navigation</text>

  <rect x="669" y="524" width="146" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="742" y="545" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#F87171" text-anchor="middle">Reduce text blocks</text>

  <!-- Brand tag -->
  <text x="600" y="600" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#475569" text-anchor="middle">Free &middot; No signup &middot; Instant results</text>
</svg>
